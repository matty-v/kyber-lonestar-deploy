# environments/lonestar/values.yaml
# Kyber on Steve's Proxmox box — cluster kyber-lonestar.
# Single-node k3s on Ubuntu 24.04, LAN-isolated VM, public via Cloudflare Tunnel.
# Images pinned to release v2.7.0 (digest-pinned). The cluster tracks the release
# line; every pin here is a tagged release build, never a main-commit digest.

image:
  # All EIGHT images on the v2.7.0 release, digest-pinned. Digests resolved from
  # GHCR at bump time with an ANONYMOUS pull token — that anonymous 200 is also
  # the public-pullability proof this cluster needs, because imagePullSecrets is
  # empty here (a private image fails at pull time, not at render time).
  # Cross-checked against the falcon environment's v2.7.0 pins — same release,
  # same digests.
  #
  # Eight, not seven: telegramSidecar is NEW to this file (see its note below).
  #
  # What v2.7.0 carries that v2.6.3 did not:
  #   - kyber#693 — Telegram sidecar interactions: inbound attachments, edited
  #     messages, reactions, callbacks and coalesced media albums; inline buttons
  #     on reply and tri-state keyboard handling on edit_message; outbound files
  #     via native Telegram photo/video/audio/voice/document/media-group methods;
  #     typing indicators. Also converges Telegram config across Codex and Claude
  #     Code agents (allowlist/HMAC/binding migration for existing agents).
  #   - kyber#695 — the inbound envelope dropped message_id, so `react` and
  #     `edit_message` could not target a user's message at all. The sidecar was
  #     always sending it; the binding's JSON-path map just didn't carry it.
  #     Closes kyber#694.
  #   - kyber#696 — Codex agents get two auth paths (in-pod `codex login
  #     --device-auth` for ChatGPT subscriptions, or plain OPENAI_API_KEY) and
  #     now carry session recall + identity-repo skills across a restart the way
  #     Claude Code agents already do. hk-47 is the consumer on this cluster:
  #     v2.6.3 finally gave him an identity repo, this makes him keep it and his
  #     continuity across a pod roll.
  #   - kyber#697 — Streamable HTTP Discord MCP: reply, edit, reactions,
  #     attachment download/upload, long-message splitting, threads, bounded
  #     recent context, connection diagnostics, idle-gated config convergence.
  #     Barf is the consumer here.
  #
  # ROLLS AGENT PODS. claude-code, runtime-base and codex all move, so barf,
  # threepio and hk-47 restart and their live sessions end. Identity repos and
  # PVCs are untouched, so they come back with memory and continuity intact.
  controlPlane:
    repository: ghcr.io/matty-v/kyber-control-plane
    tag: "v2.7.0@sha256:fe0a6d4ac03be60fc5213f4a55fb504269ced8f6c2b2f50bdf5fd356b8c6bb25"
  nodeAgent:
    repository: ghcr.io/matty-v/kyber-node-agent
    tag: "v2.7.0@sha256:0dc95532e9eff0285b05d80ba84f4d155989c6d6ab534c3f635b7e71ff3339db"
  agentBase:
    repository: ghcr.io/matty-v/kyber-runtime-base
    tag: "v2.7.0@sha256:957618b21e1f153f1a26f33390503052dc10ec5a6086bef130f97151b0e14b6a"
  claudeCode:
    repository: ghcr.io/matty-v/kyber-claude-code
    tag: "v2.7.0@sha256:16c90f0a14384e415b5e73ec0ddbff829a6545f574a1edfd932e2bb8803acd6d"
  # codex — the second agent runtime (kyber#672). Required here because hk-47 is
  # a Codex agent. The chart treats this tag as OPTIONAL and simply omits
  # KYBER_CODEX_RUNTIME_IMAGE when it is empty
  # (deploy/helm/kyber/templates/control-plane/deployment.yaml:191); the codex
  # adapter then returns "" for the image and the reconciler builds a pod whose
  # containers[0].image is empty. The API server rejects that with
  # `spec.containers[0].image: Required value`, the reconcile returns early
  # before the phase is ever written, and the Agent sits with a BLANK status
  # forever — no pod, no phase, no message. That is exactly what hk-47 hit.
  #
  # ghcr.io/matty-v/kyber-codex used to be a PRIVATE GHCR package, which with
  # imagePullSecrets: [] would have left hk-47 in ImagePullBackOff. It is public
  # now — re-verified at every bump with an ANONYMOUS ghcr.io token: a manifest
  # HEAD for v2.7.0 returns 200. Re-check that before moving this pin again; a
  # private image here fails at pull time, not at render time.
  #
  # NOTE: the old "kyber-mcp-telegram is still private, 403 as a control" claim
  # that used to live here is STALE — all eight kyber images are public now, and
  # mcp-telegram was re-verified at 200 anonymously at this bump. It is what let
  # telegramSidecar be pinned below.
  codex:
    repository: ghcr.io/matty-v/kyber-codex
    tag: "v2.7.0@sha256:4491902f897043d306636a131d09fac2d7a5e91221d1f5dcef99b633128dba74"
  statusSidecar:
    repository: ghcr.io/matty-v/kyber-status-sidecar
    tag: "v2.7.0@sha256:39da96ade7cca4688fca39a33177e34dbcf03c70a915d51c456276d7b51c9e7e"
  # kyber-mcp-discord sidecar (kyber#646) — injected into barf's pod (channels.discord).
  # Must move in lockstep with controlPlane: mentionOnly (#648) is the control
  # plane rendering DISCORD_MENTION_ONLY and this image honouring it, so it moves
  # with the rest of the release rather than being left behind.
  # v2.6.3 DOES change this image: kyber#675 fixed Discord late-join deafness (a
  # sidecar that connects before its bot is invited to a guild stays silently
  # deaf) and a data race on State.Guilds. Barf is the consumer here.
  discordSidecar:
    repository: ghcr.io/matty-v/kyber-mcp-discord
    tag: "v2.7.0@sha256:c46ecbeb0ef65d7df016489f36ec5e2ecec6e97a92aed215764b7656604c5a5e"
  # kyber-mcp-telegram sidecar — NEW to this file at v2.7.0, and the gap this
  # bump closes. kyber#688/#689 converged Telegram onto one MCP sidecar for both
  # runtimes, and falcon has pinned this image since v2.6.3 — lonestar never did.
  #
  # An empty tag here is NOT a render error, which is exactly why it went
  # unnoticed: chart templates/control-plane/deployment.yaml:174 wraps the env in
  # `{{- with .Values.image.telegramSidecar }}`, so an empty value simply means
  # KYBER_TELEGRAM_SIDECAR_IMAGE is never set and Telegram injection is a silent
  # no-op. Any agent on this cluster enabling channels.telegram would come up
  # looking healthy and just never receive a message.
  #
  # Injected ONLY into pods of agents that enable spec.channels.telegram, so
  # pinning it is a no-op until one does — it does not by itself roll anything.
  telegramSidecar:
    repository: ghcr.io/matty-v/kyber-mcp-telegram
    tag: "v2.7.0@sha256:d444da3b62eaaf1d46fb3a09038a588f2e60bec5c42963c9dcaf64884d365d8c"
# Public GHCR images — no pull secret required.
imagePullSecrets: []

api:
  existingSecret: kyber-api-credentials
  publicURL: "https://kyber-lonestar.voget.io"
  service:
    type: LoadBalancer

# Per-agent internal :8082 authz (kyber#566). Signing key pre-created
# out-of-band (kyber-internal-signing-key). Start in GRACE (accept-and-log
# un-tokened calls) for first boot; flip to enforce (graceMode: false) after
# verifying the fleet carries mounted pod-tokens.
internalAuth:
  graceMode: true

# :8082-scoped NetworkPolicy (defense-in-depth). k3s ENFORCES NetworkPolicy, so
# the hostNetwork node-agent's node IP and the pod CIDR must be admitted or its
# :8082 calls are dropped. Single-node cluster.
networkPolicy:
  enabled: true
  internalApi:
    allowedNodeCIDRs:
      - "10.42.0.0/16"          # k3s default pod CIDR (agent pods)
      - "192.168.176.244/32"    # kyber-lonestar node InternalIP (hostNetwork node-agent)

# Cloudflare Tunnel — public ingress at https://kyber-lonestar.voget.io.
# The tunnel dials OUT from the VM (no inbound/firewall change on Steve's LAN).
# Credentials live in kyber-cloudflared-creds (key credentials.json), created
# out-of-band from a tunnel provisioned via the Cloudflare API.
cloudflared:
  enabled: true
  tunnelId: "f3cdb15d-58df-4132-9af9-8ddc1017f17f"
  existingSecret: kyber-cloudflared-creds
  # Force TCP/443 (http2) rather than QUIC/UDP — Steve's LAN egress policy may
  # filter outbound UDP; http2 uses the same TLS listener as normal HTTPS.
  protocol: http2
  ingress:
    - hostname: kyber-lonestar.voget.io
      service: http://kyber-lonestar-control-plane:8080

# Single node, no cloud — Machine Controller uses the mock adapter.
compute:
  provider: mock

# k3s join config lives in kyber-api-credentials (k3s-join-token, k3s-server-url).
k3s:
  existingSecret: ""

controlPlane:
  clusterName: "kyber-lonestar"
  cors:
    allowedOrigins:
      - "https://holocron.voget.io"
      - "http://localhost:5173"

# Use k3s's default local-path StorageClass (chart default kyber-pd is GCE-only).
storage:
  agentStorageClass: ""
  gcePD:
    enabled: false
  transcriptOffsets:
    storageClassName: ""

# Postgres password pre-provisioned out-of-band (kyber-postgres-credentials).
postgresql:
  auth:
    existingSecret: kyber-postgres-credentials

# Durable log archive (MinIO + Vector). No cloud object store on this install, so
# the archive runs on the s3 backend against in-cluster MinIO — same shape as razer.
# Backs GET /agents/{name}/logs?source=archive|transcript; without it the PWA's
# agent history returns 503 ("KYBER_LOG_ARCHIVE_BUCKET unset").
# kyber-minio-credentials (access-key-id/secret-access-key) is pre-created
# out-of-band so ArgoCD renders don't regenerate the root password each sync.
minio:
  enabled: true
  existingSecret: kyber-minio-credentials
  persistence:
    storageClassName: ""
logShipper:
  enabled: true
  backend: s3
  bucket: kyber-agent-logs
  endpoint: http://kyber-lonestar-minio.kyber-system.svc:9000
  region: us-east-1
  useTLS: false
  existingCredentialsSecret: kyber-minio-credentials

# Agent identity repos — managed by the per-install "Kyber-lonestar" GitHub App
# (App ID 4442436, installed on matty-v). The kyber-github-app Secret
# (app-id/installation-id/private-key.pem) is pre-created out-of-band. defaultOwner
# is the account the App is installed on = where agent identity repos live.
identityRepo:
  defaultOwner: "matty-v"
